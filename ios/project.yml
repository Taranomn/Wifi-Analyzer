name: WiFiSurvey
options:
  bundleIdPrefix: com.wifisurvey
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  WiFiSurvey:
    type: application
    platform: iOS
    sources:
      - WiFiSurvey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wifisurvey.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WiFiSurvey/Info.plist
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
